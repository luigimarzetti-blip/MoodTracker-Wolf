name: Compila APK Mood Tracker

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 Scarica i file del progetto
        uses: actions/checkout@v4

      - name: 🐍 Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ☕ Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Installa i programmi di sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: ⚙️ Installa Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade "Cython<3.0.0"
          pip install buildozer virtualenv

      - name: 🚀 Lancia la Build (Crea l'APK)
        run: |
          yes | buildozer -v android debug

      - name: 📦 Salva e Consegna l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MoodTracker-Wolf-APK
          path: bin/*.apk
