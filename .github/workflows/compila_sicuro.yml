name: Compila APK Sicuro

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Dipendenze Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            openjdk-17-jdk \
            unzip \
            zip

      - name: Installazione Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython git+https://github.com/kivy/python-for-android.git

      - name: Build APK con Buildozer
        run: buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"

      - name: Caricamento APK come Artefatto
        uses: actions/upload-artifact@v4
        with:
          name: MoodTracker-Wolf-APK
          path: bin/*.apk
