name: Compila APK Sicuro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa i programmi Linux necessari
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk unzip zip
          pip install buildozer cython==0.29.33 virtualenv

      - name: Compila l'APK (Può richiedere 15 min)
        run: buildozer android debug

      - name: Salva l'APK finale
        uses: actions/upload-artifact@v4
        with:
          name: App_MoodTracker_APK
          path: bin/*.apk
