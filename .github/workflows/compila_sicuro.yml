name: Compila APK Sicuro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # Cambiamo da 'latest' a '22.04' per stabilità
    runs-on: ubuntu-22.04

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Setup Java e Dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk build-essential git python3-pip ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev unzip zip

      - name: Installa Buildozer
        run: |
          pip3 install --user --upgrade pip
          pip3 install --user buildozer cython==0.29.33
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compila APK
        run: |
          # Usiamo il flag --warn per vedere meglio gli errori se fallisce
          buildozer -v android debug
          
      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: App_MoodTracker_APK
          path: bin/*.apk
