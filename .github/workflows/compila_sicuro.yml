name: Compila APK Sicuro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    # FORZIAMO UBUNTU 22.04 per stabilità
    runs-on: ubuntu-22.04

    steps:
      - name: Scarica codice
        uses: actions/checkout@v4

      - name: Configura Sistema e Java
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jdk build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev unzip zip libtinfo5

      - name: Installa Buildozer
        run: |
          pip3 install --user --upgrade pip
          pip3 install --user buildozer cython==0.29.33 virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compila l'APK
        run: |
          export JAVA_OPTS="-Xmx4g"
          # Usiamo "yes" per accettare automaticamente tutte le licenze Android se richieste
          yes | buildozer -v android debug

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: MoodTracker-Package
          path: bin/*.apk
