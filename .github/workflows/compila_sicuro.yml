name: Compila APK Sicuro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Mirror e Java
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jdk

      - name: Installa Dipendenze Python
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev unzip zip
          pip3 install --user --upgrade pip
          pip3 install --user buildozer cython==0.29.33 virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Accetta Licenze Android e Compila
        run: |
          # Questo comando forza l'accettazione delle licenze prima di compilare
          yes | buildozer android debug
          
      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: App_MoodTracker_APK
          path: bin/*.apk

