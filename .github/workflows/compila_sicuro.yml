name: Compila APK Sicuro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # Cambiato a 20.04 per massima stabilità

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Java (Metodo Diretto)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze Buildozer
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential git python3 python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev unzip zip
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 virtualenv

      - name: Compila l'APK (Può richiedere 15 min)
        run: buildozer android debug

      - name: Salva l'APK finale
        uses: actions/upload-artifact@v4
        with:
          name: App_MoodTracker_APK
          path: bin/*.apk
